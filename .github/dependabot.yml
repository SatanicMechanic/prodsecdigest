version: 2

# No `cooldown:` key on purpose. Since 2026-07-14 Dependabot applies a 3-day
# default cooldown to version updates on every ecosystem, with no config — so
# setting `default-days: 2` would SHORTEN it and `3` merely restates it. Set
# this key only to ask for longer than 3 days. Security updates are exempt and
# still open immediately, which is what you want.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # One PR per run: sibling workflow-editing PRs can't auto-merge via GITHUB_TOKEN.
    # Minor/patch only, so a major (held for review here) opens separately and
    # doesn't block the rest of the group.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
