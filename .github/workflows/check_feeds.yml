name: Feed Health Check

on:
  schedule:
    # Weekly, Sundays at 15:17 UTC (off-round: the top of the hour is the
    # most contended scheduling slot on Actions)
    - cron: '17 15 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This repo is a template — inert here, active in private mirrors.
    if: github.repository != 'SatanicMechanic/prodsecdigest'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv venv
      - run: uv pip install --require-hashes -r requirements.txt
      - run: uv run python check_feeds.py
