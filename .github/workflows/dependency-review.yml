name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Private mirrors skip this: the Dependency Review API requires GitHub
    # Advanced Security on private repos, so the job can only ever fail there.
    if: ${{ !github.event.repository.private }}
    # Advisory only — does not block merge via ruleset or dependabot-auto-merge.
    # dependabot-auto-merge.yml polls only the `test` check, so a failed
    # Dependency Review stays visible for human PRs but does not stop
    # auto-merge. To make it a gate, add a second select(.name == "review")
    # poll in that workflow and (optionally) add `review` to the ruleset's
    # required_status_checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
