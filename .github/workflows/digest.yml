name: Need to Know

on:
  schedule:
    # Off-round minutes on purpose: GitHub queues scheduled workflows and the
    # top of the hour (and other round values) is the most contended slot, so
    # a :00 or :30 cron is the most likely to be delayed or dropped.
    #
    # Nominally 23:37 PDT the *previous* evening — shifted 4h early on purpose.
    # Since 2026-08-27 GitHub's scheduler has run 3.7-5.2h behind on this slot
    # (evening slot below is only ~1.7h behind, so it is left alone), which
    # lands this at ~03:20-04:50 PDT. If the drift goes away it fires the night
    # before; restore to '37 10' at that point.
    - cron: '37 06 * * 1-5'
    # 22:43 UTC = 15:43 PDT / 14:43 PST — the emergency re-check; sends only a
    # new critical threat if the morning run already delivered.
    - cron: '43 22 * * 1-5'
  workflow_dispatch:

# Read-only: this job never commits or pushes. Its only writes are the
# actions/cache save+restore below, which use the Actions cache service, not
# GITHUB_TOKEN. Keeping it read means the job holding every provider API key
# carries no repo-write it can't use.
permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This repo is a template — inert here, active in private mirrors. Without
    # this the schedule fires twice daily upstream with no secrets and no
    # LLM_MODEL, failing every run.
    if: github.repository != 'SatanicMechanic/prodsecdigest'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --require-hashes -r requirements.txt

      - name: Restore digest state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: state.json
          key: digest-state-${{ github.run_id }}
          restore-keys: digest-state-

      - name: Run digest
        env:
          # LLM_MODEL is REQUIRED — there is no built-in default, so a new
          # model release is a repo-variable change, not a code change. The
          # provider defaults to GitHub Models (GH_MODELS_TOKEN below is the
          # only key needed); to switch, set LLM_PROVIDER and add that
          # provider's key secret below. LLM_BASE_URL/LLM_API_KEY_ENV are only
          # needed for a provider not in config.PROVIDERS.
          LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
          LLM_MODEL:         ${{ vars.LLM_MODEL }}
          LLM_BASE_URL:      ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY_ENV:   ${{ vars.LLM_API_KEY_ENV }}
          LLM_EXTRA:         ${{ vars.LLM_EXTRA }}
          XAI_API_KEY:       ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GH_MODELS_TOKEN:   ${{ secrets.GH_MODELS_TOKEN }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL:   ${{ vars.DIGEST_TO_EMAIL }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          BRAVE_API_KEY:     ${{ secrets.BRAVE_API_KEY }}
          BRAVE_GOGGLES:     ${{ vars.BRAVE_GOGGLES }}
        run: uv run python digest.py

      - name: Save digest state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: state.json
          key: digest-state-${{ github.run_id }}

      # State is cache-only. Committing the 'sent' subset back to the repo was
      # tried (v1.2.0) and never worked: the gate checked `git diff` before
      # staging, which ignores untracked files, so it silently never fired.
      # Fixing the gate then exposed the real blocker — main's ruleset requires
      # a PR plus the "test" check, and GitHub Actions is not an eligible bypass
      # actor. The only way through is a bypass credential, which this job must
      # not hold: it installs third-party code, so branch protection is what
      # stops a bad dependency release from reaching main. Losing the cache
      # costs a repeated story, which ages out in 30 days — not worth that trade.
