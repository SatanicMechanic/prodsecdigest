name: Sync from upstream

# Private-fork automation: merges the public upstream (dependabot-maintained
# Actions pins and dependency floors) into this repo on a schedule.
#
# Ships in the public repo but is inert there (repo guard below) — it only
# does work in private mirrors. Design notes:
#   - Tests run INSIDE this job as the merge gate: pushes made with
#     GITHUB_TOKEN do not trigger the Tests workflow, so gating must be
#     inline. A red suite or a merge conflict fails the job (GitHub emails
#     on scheduled-workflow failure) and nothing is pushed.
#   - Requires shared ancestry: run the one-time
#     `git merge upstream/main --allow-unrelated-histories` setup first.
#   - A conflict usually means upstream touched stack.txt's template or a
#     file you changed privately — resolve manually, keeping your version
#     of stack.txt.

on:
  schedule:
    # Mondays 08:23 UTC — ahead of the 10:37 UTC Monday digest run, and
    # off-round because the top of the hour is the most contended slot.
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: SatanicMechanic/n2ksecdigest

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No-op on the upstream repo itself.
    if: github.repository != 'SatanicMechanic/n2ksecdigest'

    steps:
      # First step so it instruments the whole job — this is the only job that
      # executes freshly-merged upstream code (the pytest gate below). Block,
      # not audit: a missing endpoint just fails this scheduled job loudly
      # (GitHub emails on failure, nothing pushed) — no silent bypass risk.
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          # List built from a real captured audit run (digest.yml, same
          # checkout/setup-uv/uv steps), not guessed statically.
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443

      # persist-credentials off: the test step below executes freshly-merged
      # upstream code, which must not have a push-capable token in reach.
      # The push step supplies the token explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests (merge gate)
        if: steps.merge.outputs.changed == 'true'
        run: |
          uv venv
          uv pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          uv run pytest -q

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
