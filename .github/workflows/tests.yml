name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv venv
      # No fallback and no dependabot exemption: a hash mismatch means the
      # artifact on the index is not the one we pinned. That must fail the
      # `test` check so dependabot-auto-merge refuses the PR. Fix by running
      # `uv pip compile --generate-hashes`, not by installing unverified.
      - run: uv pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: uv run pytest -q
